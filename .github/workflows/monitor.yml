name: RIIZE magnetic doll restock alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run one inventory check, an inspection, or a test email'
        type: choice
        default: inspect
        options:
          - inspect
          - test-email
          - check

permissions:
  contents: write

concurrency:
  group: riize-magnetic-doll-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser for dynamic stock labels
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Check six members once
        env:
          MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.mode || 'inspect' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: siya2026z@gmail.com
        shell: bash
        run: |
          python3 monitor.py
          if [[ "$MODE" == "check" && -f stock-state.json ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stock-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update magnetic doll stock status'
              git push origin HEAD:main
            fi
          fi
