name: RIIZE magnetic doll + baby key ring restock alert

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Both products: inspect, test email, check, or 12-check hourly watch'
        type: choice
        default: inspect
        options:
          - inspect
          - test-email
          - check
          - watch

permissions:
  contents: write

concurrency:
  group: riize-multi-product-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser for dynamic stock labels
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Check two six-member products on a five-minute cadence
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'watch' || inputs.mode || 'inspect' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: siya2026z@gmail.com
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rounds=1
          mode="$RUN_MODE"
          if [[ "$RUN_MODE" == "watch" ]]; then
            rounds=12
            mode=check
          fi

          failed=0
          # Navigation timeouts (exit 2) can recover in a later round.
          # All other errors stay fatal, including notification errors.
          declare -A pending_timeout=([monitor.py]=0 [baby_riize_monitor.py]=0)
          for ((i=1; i<=rounds; i++)); do
            started=$SECONDS
            echo "Inventory check $i/$rounds; mode=$mode"
            # A failure in one product must not prevent checking the other.
            for script in monitor.py baby_riize_monitor.py; do
              if MODE="$mode" python3 "$script"; then
                echo "$script: completed"
                pending_timeout[$script]=0
              else
                status=$?
                echo "::warning::$script failed (exit $status); its saved state was not updated."
                if (( status == 2 )); then
                  pending_timeout[$script]=1
                else
                  failed=1
                fi
              fi
            done

            if [[ "$mode" == "check" ]]; then
              git add stock-state.json
              if [[ -f baby-riize-state.json ]]; then
                git add baby-riize-state.json
              fi
              if ! git diff --cached --quiet; then
                if git commit -m 'Update RIIZE product inventory status' && git push origin HEAD:main; then
                  echo 'Inventory states persisted.'
                else
                  echo '::error::Unable to persist inventory states.'
                  failed=1
                fi
              fi
            fi

            if (( i < rounds )); then
              elapsed=$((SECONDS - started))
              remaining=$((300 - elapsed))
              if (( remaining > 0 )); then sleep "$remaining"; fi
            fi
          done
          for script in monitor.py baby_riize_monitor.py; do
            if (( pending_timeout[$script] )); then
              echo "::error::$script did not recover from its last navigation timeout."
              failed=1
            fi
          done
          exit "$failed"
